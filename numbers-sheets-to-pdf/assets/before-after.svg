<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Before: one Numbers file with three sheets. After: a Demo Invoices PDFs folder with Rates.pdf, Invoice- ACME-01.pdf and Invoice 002.pdf">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0FDF4"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F87171"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="560" rx="24" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- ============ BEFORE ============ -->
    <text x="60" y="64" font-size="15" font-weight="800" fill="#16A34A" letter-spacing="2">BEFORE</text>
    <text x="60" y="94" font-size="24" font-weight="700" fill="#0F172A">1 file, 3 sheets</text>

    <g transform="translate(60 120)" filter="url(#shadow)">
      <rect width="500" height="380" rx="14" fill="#FFFFFF"/>
      <!-- title bar -->
      <path d="M14 0 H486 A14 14 0 0 1 500 14 V44 H0 V14 A14 14 0 0 1 14 0 Z" fill="#F1F5F9"/>
      <circle cx="22" cy="22" r="6" fill="#FF5F57"/><circle cx="42" cy="22" r="6" fill="#FEBC2E"/><circle cx="62" cy="22" r="6" fill="#28C840"/>
      <text x="250" y="27" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Demo Invoices.numbers</text>
      <!-- sheet tabs -->
      <rect x="0" y="44" width="500" height="44" fill="#F8FAFC"/>
      <line x1="0" y1="88" x2="500" y2="88" stroke="#E2E8F0"/>
      <g font-size="13" font-weight="600">
        <rect x="16" y="54" width="78" height="26" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="55" y="71" text-anchor="middle" fill="#64748B">Rates</text>
        <rect x="102" y="54" width="148" height="26" rx="7" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.5"/>
        <text x="176" y="71" text-anchor="middle" fill="#15803D">Invoice: ACME/01</text>
        <rect x="258" y="54" width="108" height="26" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="312" y="71" text-anchor="middle" fill="#64748B">Invoice 002</text>
      </g>
      <!-- table -->
      <g transform="translate(40 116)">
        <text x="0" y="0" font-size="13" font-weight="700" fill="#94A3B8">Table 1</text>
        <rect x="0" y="16" width="420" height="200" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
        <line x1="0" y1="66" x2="420" y2="66" stroke="#E2E8F0"/>
        <line x1="0" y1="116" x2="420" y2="116" stroke="#E2E8F0"/>
        <line x1="0" y1="166" x2="420" y2="166" stroke="#E2E8F0"/>
        <line x1="190" y1="16" x2="190" y2="216" stroke="#E2E8F0"/>
        <g font-size="18">
          <text x="20" y="48" font-weight="600" fill="#334155">Client</text>
          <text x="210" y="48" fill="#0F172A">ACME</text>
          <text x="20" y="98" font-weight="600" fill="#334155">Total</text>
          <text x="210" y="98" font-weight="700" fill="#0F172A">150</text>
          <text x="20" y="148" font-weight="600" fill="#334155">Double</text>
          <text x="210" y="148" font-weight="700" fill="#0F172A">300</text>
        </g>
        <!-- formula hint -->
        <g transform="translate(262 82)">
          <rect width="146" height="24" rx="12" fill="#ECFDF5"/>
          <text x="73" y="16" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">= from "Rates" sheet</text>
        </g>
      </g>
    </g>

    <!-- ============ ARROW ============ -->
    <g transform="translate(588 286)">
      <rect x="0" y="-26" width="104" height="52" rx="26" fill="url(#green)" filter="url(#soft)"/>
      <path d="M22 -9 L36 0 L22 9 Z" fill="#FFFFFF"/>
      <text x="44" y="6" font-size="15" font-weight="800" fill="#FFFFFF">Run</text>
      <text x="52" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#64748B">1 click</text>
    </g>

    <!-- ============ AFTER ============ -->
    <text x="720" y="64" font-size="15" font-weight="800" fill="#16A34A" letter-spacing="2">AFTER</text>
    <text x="720" y="94" font-size="24" font-weight="700" fill="#0F172A">1 PDF per sheet</text>

    <g transform="translate(720 120)" filter="url(#shadow)">
      <rect width="500" height="380" rx="14" fill="#FFFFFF"/>
      <path d="M14 0 H486 A14 14 0 0 1 500 14 V44 H0 V14 A14 14 0 0 1 14 0 Z" fill="#F1F5F9"/>
      <circle cx="22" cy="22" r="6" fill="#FF5F57"/><circle cx="42" cy="22" r="6" fill="#FEBC2E"/><circle cx="62" cy="22" r="6" fill="#28C840"/>
      <!-- folder icon + title -->
      <g transform="translate(166 13)">
        <path d="M0 3 A3 3 0 0 1 3 0 H8 L11 3 H19 A3 3 0 0 1 22 6 V15 A3 3 0 0 1 19 18 H3 A3 3 0 0 1 0 15 Z" fill="url(#folder)"/>
        <text x="30" y="14" font-size="14" font-weight="600" fill="#475569">Demo Invoices PDFs</text>
      </g>
      <!-- "created automatically" tag -->
      <g transform="translate(316 62)">
        <rect width="168" height="26" rx="13" fill="#E0F2FE"/>
        <text x="84" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="#0369A1">✓ created automatically</text>
      </g>

      <!-- three PDF files -->
      <g font-size="14" font-weight="600" fill="#334155">
        <g transform="translate(48 120)">
          <g filter="url(#soft)">
            <path d="M0 0 H62 L86 24 V116 H0 Z" fill="#FFFFFF" stroke="#E2E8F0"/>
            <path d="M62 0 V24 H86" fill="#E2E8F0"/>
            <rect x="12" y="36" width="50" height="6" rx="3" fill="#CBD5E1"/>
            <rect x="12" y="50" width="62" height="6" rx="3" fill="#E2E8F0"/>
            <rect x="-6" y="80" width="50" height="22" rx="4" fill="url(#red)"/>
            <text x="19" y="96" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">PDF</text>
          </g>
          <text x="43" y="148" text-anchor="middle">Rates.pdf</text>
        </g>
        <g transform="translate(207 120)">
          <g filter="url(#soft)">
            <path d="M0 0 H62 L86 24 V116 H0 Z" fill="#FFFFFF" stroke="#E2E8F0"/>
            <path d="M62 0 V24 H86" fill="#E2E8F0"/>
            <rect x="12" y="36" width="50" height="6" rx="3" fill="#CBD5E1"/>
            <rect x="12" y="50" width="62" height="6" rx="3" fill="#E2E8F0"/>
            <rect x="-6" y="80" width="50" height="22" rx="4" fill="url(#red)"/>
            <text x="19" y="96" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">PDF</text>
          </g>
          <text x="43" y="148" text-anchor="middle">Invoice- ACME-01.pdf</text>
        </g>
        <g transform="translate(366 120)">
          <g filter="url(#soft)">
            <path d="M0 0 H62 L86 24 V116 H0 Z" fill="#FFFFFF" stroke="#E2E8F0"/>
            <path d="M62 0 V24 H86" fill="#E2E8F0"/>
            <rect x="12" y="36" width="50" height="6" rx="3" fill="#CBD5E1"/>
            <rect x="12" y="50" width="62" height="6" rx="3" fill="#E2E8F0"/>
            <rect x="-6" y="80" width="50" height="22" rx="4" fill="url(#red)"/>
            <text x="19" y="96" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">PDF</text>
          </g>
          <text x="43" y="148" text-anchor="middle">Invoice 002.pdf</text>
        </g>
      </g>

      <!-- footer note -->
      <line x1="24" y1="318" x2="476" y2="318" stroke="#F1F5F9"/>
      <text x="250" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="#16A34A">Totals still correct: 150 · 300 · 360</text>
    </g>
  </g>
</svg>
