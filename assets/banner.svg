<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="biteasier YouTube Tutorials: ready-to-use automation scripts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D4D"/>
      <stop offset="1" stop-color="#FF9F43"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <!-- Brand pill -->
  <g transform="translate(80 70)">
    <rect width="168" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="14" y="11" width="26" height="18" rx="5" fill="url(#accent)"/>
    <path d="M24 15.5 L31 20 L24 24.5 Z" fill="#FFFFFF"/>
    <text x="52" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E2E8F0">@biteasier</text>
  </g>

  <!-- Title -->
  <text x="80" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">YouTube Tutorials</text>
  <rect x="82" y="200" width="120" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#CBD5E1">Ready-to-use automation scripts, explained step by step.</text>

  <!-- Topic chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <g transform="translate(80 280)">
      <rect width="148" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1"/>
      <text x="74" y="22" text-anchor="middle" fill="#F1F5F9">Mac automation</text>
    </g>
    <g transform="translate(240 280)">
      <rect width="118" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1"/>
      <text x="59" y="22" text-anchor="middle" fill="#F1F5F9">AppleScript</text>
    </g>
    <g transform="translate(370 280)">
      <rect width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1"/>
      <text x="75" y="22" text-anchor="middle" fill="#F1F5F9">Power Automate</text>
    </g>
    <g transform="translate(532 280)">
      <rect width="96" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1"/>
      <text x="48" y="22" text-anchor="middle" fill="#F1F5F9">Python</text>
    </g>
  </g>

  <!-- Illustration: script window feeding a play button -->
  <g transform="translate(820 70)">
    <!-- code window -->
    <rect x="0" y="20" width="300" height="200" rx="16" fill="#0B1020" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="0" y="20" width="300" height="38" rx="16" fill="#FFFFFF" fill-opacity="0.06"/>
    <rect x="0" y="44" width="300" height="14" fill="#0B1020"/>
    <circle cx="24" cy="39" r="6" fill="#FF5F57"/>
    <circle cx="44" cy="39" r="6" fill="#FEBC2E"/>
    <circle cx="64" cy="39" r="6" fill="#28C840"/>
    <g>
      <rect x="24" y="80" width="70" height="10" rx="5" fill="#C084FC"/>
      <rect x="102" y="80" width="120" height="10" rx="5" fill="#64748B"/>
      <rect x="44" y="104" width="90" height="10" rx="5" fill="#38BDF8"/>
      <rect x="142" y="104" width="70" height="10" rx="5" fill="#64748B"/>
      <rect x="44" y="128" width="54" height="10" rx="5" fill="#FB923C"/>
      <rect x="106" y="128" width="140" height="10" rx="5" fill="#64748B"/>
      <rect x="64" y="152" width="110" height="10" rx="5" fill="#4ADE80"/>
      <rect x="44" y="176" width="80" height="10" rx="5" fill="#38BDF8"/>
      <rect x="24" y="200" width="60" height="10" rx="5" fill="#C084FC"/>
    </g>
    <!-- play badge -->
    <g transform="translate(300 205)">
      <circle r="58" fill="url(#accent)"/>
      <circle r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
      <path d="M-16 -24 L28 0 L-16 24 Z" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
